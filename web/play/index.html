    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grues in Comic</title>
    <link rel="canonical" href="https://grues.danielkimdev.com/play/" />
    <link rel="preload" href="/tokens.css" as="style" />
    <link rel="stylesheet" href="./style.css" />

    <!-- Umami: cookieless, no personal data collected. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="441036e0-3773-44ce-8d76-55b6fc9aeb6b"></script>
  </head>
  <body>
    <!--
      Stage 5.3: the comic pane takes the primary slot ADR 0004 §4 assigns it,
      and the console keeps its role unchanged — subordinate but always complete,
      because narration is accompanied, never replaced (§2). Both panes stay
      visible when the grid stacks (§4a); neither becomes a drawer.

      The event inspector moves inside the console pane as a collapsed details.
      It is 5.2's most useful half — it renders exactly the event types the
      console drops, which are the ones the comic draws — so it stays reachable
      without competing with the comic for the primary slot.
    -->
    <main id="shell">
      <section id="comic" aria-label="Comic">
        <!-- The version/state label is generated by tools/build-changelog.ts from
             CHANGELOG.md's newest entry. Do not hand-edit it: a hand-typed
             version on the one screen players look at is a claim that rots at
             the next release. -->
        <h2><a href="/" class="wordmark">Grues in Comic</a> <small><!-- VERSION:START -->v0.27.3 BETA<!-- VERSION:END --></small></h2>
        <!-- The cast bar is Comic Chat's member list (5.4). Labels come from
             `castLabel` (comic-view.ts), not from the manifest: the manifest
             only knows which drawings were cast (ADR 0004 §11), and the
             character names are ADR 0006 Slice 3's. -->
        <div class="comic-cast" aria-label="Cast"></div>
        <div class="comic-strip"></div>
        <!-- One control for both panes (`jump.ts`). It overlays the strip rather
             than taking a row: on a portrait phone every pixel of permanent
             chrome comes off the panel. Each button hides itself when it has
             nothing to do, so ordinary play shows neither. -->
        <div class="jump-controls" hidden>
          <button type="button" data-jump="beginning" hidden>Jump to beginning</button>
          <button type="button" data-jump="latest" hidden>Jump to latest</button>
        </div>
      </section>

      <section id="console" aria-label="Game transcript">
        <div class="status-line">
          <span class="status-room"></span>
          <span class="status-score"></span>
        </div>
        <div class="transcript" role="log" aria-live="polite"></div>
        <details id="inspector" aria-label="Event stream">
          <summary>Event stream <small>ADR 0002 contract</small></summary>
          <div class="inspector-body">
            <div class="inspector-block">
              <h3>Mix so far</h3>
              <div class="mix"></div>
            </div>
            <div class="inspector-block">
              <h3>Last turn</h3>
              <div class="last-events"></div>
            </div>
          </div>
        </details>
        <form id="command-form" autocomplete="off">
          <label class="prompt" for="command">&gt;</label>
          <input id="command" name="command" type="text" autocomplete="off"
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 aria-label="Command" />
        </form>
      </section>
    </main>

    <script type="module" src="../dist/web/src/main.js"></script>
  </body>
</html>
